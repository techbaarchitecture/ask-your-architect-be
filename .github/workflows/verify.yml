name: Verify and deploy backend

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: aya-be-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Deployment probe regression tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --omit=dev

  deploy:
    needs: backend
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rsync API source and rebuild container
        env:
          SSH_KEY: ${{ secrets.AYA_SSH_KEY }}
          HOST: ${{ secrets.AYA_SSH_HOST }}
          USER: ${{ secrets.AYA_SSH_USER }}
        run: |
          set -euo pipefail
          ENV=prod
          DEST=/opt/ask-your-architect/be/
          PORT=4100
          if [ "${GITHUB_REF_NAME}" = dev ]; then
            ENV=dev
            DEST=/opt/ask-your-architect-dev/be/
            PORT=4101
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          RSH="ssh -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes"
          rsync -az --delete \
            -e "$RSH" \
            --exclude node_modules --exclude dist --exclude data --exclude .env \
            --exclude .git --exclude docker-compose.yml \
            ./ "$USER@$HOST:$DEST"
          DIFF=$(rsync -aznci --delete -e "$RSH" \
            --exclude node_modules --exclude dist --exclude data --exclude .env \
            --exclude .git --exclude docker-compose.yml \
            ./ "$USER@$HOST:$DEST")
          if [ -n "$DIFF" ]; then
            printf '%s\n' "$DIFF"
            echo '::error::Deployed source differs from this commit'
            exit 1
          fi
          $RSH "$USER@$HOST" "/usr/local/bin/aya-release-be $ENV"
          # A healthy old container is not sufficient: the running image must
          # match the image just built by the isolated AYA release helper.
          $RSH "$USER@$HOST" "sh -s -- $ENV" < .github/scripts/verify-runtime.sh
          $RSH "$USER@$HOST" "curl -fsS --max-time 15 http://127.0.0.1:$PORT/api/health" \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data.get("ok") is True, data'
          echo 'DEPLOY_OK: source checksums, running image and backend health verified'
      - name: Public API smoke check
        env:
          PUBLIC_HEALTH: ${{ github.ref == 'refs/heads/main' && 'https://askyourarchitect.org/api/health' || 'https://dev.askyourarchitect.org/api/health' }}
        run: python3 .github/scripts/public-smoke.py "$PUBLIC_HEALTH"
